padding:10px;font-size:12px;font-weight:850;display:flex;align-items:flex-end;justify-content:flex-end;text-align:right;cursor:pointer;overflow:hidden;box-shadow:var(--shadow)}.tile:hover{filter:brightness(.98);transform:translateY(-1px)}
.filters{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;background:white;border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:16px;box-shadow:var(--shadow)}.field label{display:block;font-size:12px;font-weight:850;margin:0 0 6px;color:#64748b}.field input,.field select,.multi-btn{height:40px;border:1px solid var(--line);background:#f8fafc;border-radius:11px;padding:0 12px;min-width:142px;color:#334155;outline:none}.field input{min-width:240px}.field input:focus,.field select:focus{border-color:#93c5fd;box-shadow:0 0 0 3px rgba(37,99,235,.10)}.btn{height:40px;border:0;border-radius:11px;padding:0 14px;background:#eef2f7;color:#334155;font-weight:850;cursor:pointer}.btn:hover{background:#e2e8f0}.btn.primary{background:var(--blue);color:white}.toggle{margin-left:auto;display:flex;gap:8px}.multi{position:relative}.multi-btn{display:flex;align-items:center;justify-content:space-between;gap:8px;cursor:pointer;font-weight:750;background:#fff}.multi-menu{display:none;position:absolute;z-index:20;top:48px;left:0;width:270px;max-height:290px;overflow:auto;background:white;border:1px solid var(--line);border-radius:14px;box-shadow:0 18px 40px rgba(15,23,42,.14);padding:8px}.multi.open .multi-menu{display:block}.multi-menu label{display:flex!important;align-items:center;gap:8px;padding:8px 9px;border-radius:9px;white-space:normal;font-size:13px;color:#1f2937;cursor:pointer}.multi-menu label:hover{background:#f1f5f9}.multi-menu input[type="checkbox"]{width:16px!important;height:16px!important;min-width:16px!important;margin:0!important;flex-shrink:0!important;appearance:auto!important}
.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:var(--radius);background:white;box-shadow:var(--shadow)}.table{width:100%;border-collapse:collapse;min-width:1050px}.table th,.table td{padding:14px 16px;border-bottom:1px solid #eef2f7;text-align:left;font-size:13px;vertical-align:top}.table th{background:#f8fafc;color:#475569;font-weight:900}.table tr:hover{background:#fbfdff}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}.startup-card{padding:18px;cursor:pointer;transition:.16s ease}.startup-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-hover);border-color:#bfdbfe}.card-title{font-size:17px;font-weight:900;margin-bottom:8px;letter-spacing:-.03em}.desc{color:#475569;line-height:1.65;font-size:13px;margin:9px 0 12px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.tags{display:flex;flex-wrap:wrap;gap:7px;margin:8px 0}.tag{display:inline-flex;align-items:center;border-radius:999px;background:var(--blue2);color:#1d4ed8;font-size:12px;font-weight:800;padding:5px 9px;line-height:1}.tag.premium{background:var(--orange2);color:#b45309}.tag.level{background:var(--purple2);color:#6d28d9}.tag.market{background:var(--green2);color:#047857}.meta{display:flex;gap:18px;flex-wrap:wrap;color:#64748b;font-size:13px;margin-top:12px}.arrow{color:var(--blue);font-weight:900}.empty{padding:32px;color:#94a3b8;text-align:center}
.detail{display:none}.detail.active{display:block}.detail-hero{display:flex;justify-content:space-between;gap:18px;padding:22px}.detail-title{font-size:26px;font-weight:900;letter-spacing:-.05em}.detail-grid{display:grid;grid-template-columns:2fr 1fr;gap:16px;margin-top:16px}.kv{margin:0 0 16px}.kv b{display:block;font-size:12px;color:#64748b;margin-bottom:6px;font-weight:900;text-transform:uppercase;letter-spacing:.02em}.kv div{font-size:14px;line-height:1.7;color:#334155}.back{background:white;border:1px solid var(--line);border-radius:11px;padding:9px 13px;cursor:pointer;font-weight:850;color:#334155}.edit{background:var(--orange2);border:1px solid #fed7aa;color:#c2410c;border-radius:11px;padding:9px 13px;cursor:pointer;font-weight:850}.partner-card{padding:18px}.partner-card .name{font-weight:900;margin-bottom:8px;letter-spacing:-.02em}.muted{color:#64748b;font-size:13px;line-height:1.6}
.category-panel{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 16px}.category-chip{border:1px solid var(--line);background:white;border-radius:999px;padding:9px 13px;font-weight:850;font-size:13px;cursor:pointer;color:#334155;box-shadow:var(--shadow)}.category-chip.active,.category-chip:hover{background:var(--blue2);color:var(--blue);border-color:#bfdbfe}.similar-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin-top:10px}.similar-card{border:1px solid var(--line);background:#f8fafc;border-radius:14px;padding:13px;cursor:pointer}.similar-card:hover{background:#eef6ff;border-color:#bfdbfe}.similar-card .sim-name{font-weight:900;font-size:13px;margin-bottom:6px}.similar-card .sim-score{font-size:12px;color:#64748b}.overview-note{font-size:12px;color:#94a3b8;margin-top:10px}
@media(max-width:980px){.grid4,.grid2,.grid3,.detail-grid{grid-template-columns:1fr}.sidebar{display:none}.main{padding:16px}.topbar{padding:12px;flex-wrap:wrap}.global-search{min-width:0;flex:1}.refresh{margin-left:0}.toggle{margin-left:0}.cards{grid-template-columns:1fr}}
</style>

<div class="topbar"><div class="logo"><span class="dot"></span>IAPS Accelerator <span style="color:#2563eb">OS</span></div><input class="global-search" id="globalSearch" placeholder="搜尋新創、合作對象、活動..." oninput="globalSearch()"><button class="refresh" onclick="loadAll()">↻ 重新整理</button></div>

<script>
const API_BASE='https://script.google.com/macros/s/AKfycbzHbAmYvaKnUEqksBHzEUnEB3-mUwjbcdOHuBpdFiPI5S8bLHaBhH7NhbDTUjr2TTYYrw/exec';
const DATA_SHEET_URL='https://docs.google.com/spreadsheets/d/1DD5kdbvmfYvZ4V33Q2ZseVFr3TDF2sE6z5y8CTlnoDk/edit';
const MEMBER_SHEET_URL='https://docs.google.com/spreadsheets/d/1AEs7VCHjYoYmu8jQw1k7g1PpwqmcKTlPbI3tm7bkf2s/edit';
let raw={startups:[],alumni:[],members:[],partners:[],events:[]}; let data={startups:[],alumni:[],members:[],partners:[],events:[]}; let viewMode='list';
const MARKET_OPTIONS=['台灣','日本','歐美','東南亞','印度','不明'];
const LEVEL_OPTIONS=['鑽石','黃金','白金','加速器'];
const PARTNER_TYPES=['企業','投資人','政府單位','法人機構','學研機構','媒體','新創生態系','專業服務','其他'];
const INDUSTRY_RULES=[
 {tag:'AI',patterns:[/人工智慧/i,/\bAI\b/i,/\bmachine learning\b/i,/\bdeep learning\b/i,/\bLLM\b/i,/生成式/i]},
 {tag:'Big Data',patterns:[/大數據/i,/\bbig data\b/i,/資料分析/i,/數據分析/i]},
 {tag:'Healthcare',patterns:[/醫療/i,/健康/i,/醫材/i,/照護/i,/運動健康/i,/數位健康/i,/\bhealthcare\b/i,/\bmedical\b/i]},
 {tag:'Biotech',patterns:[/生技/i,/生醫/i,/醫藥/i,/醫療.*檢測|檢測.*醫療/i,/基因/i,/細胞/i,/\bbiotech\b/i]},
 {tag:'Manufacturing',patterns:[/製造/i,/工業/i,/材料/i,/設備/i,/工廠/i,/\bmanufacturing\b/i,/\bmaterial\b/i]},
 {tag:'Sustainability',patterns:[/減碳/i,/負碳/i,/永續/i,/綠能/i,/能源/i,/儲能/i,/循環/i,/潔淨/i,/\bESG\b/i,/\bsustainability\b/i]},
 {tag:'Smart City',patterns:[/智慧城市/i,/政府科技/i,/房地產/i,/\bsmart city\b/i]},
 {tag:'IoT',patterns:[/物聯網/i,/\bIoT\b/i,/\bAIoT\b/i,/\b5G\b/i,/車聯網/i,/電動車/i,/農漁牧/i]},
 {tag:'FinTech',patterns:[/金融科技/i,/\bfintech\b/i,/支付/i,/保險科技/i]},
 {tag:'Cloud Security',patterns:[/資安/i,/資訊安全/i,/網路安全/i,/\bcybersecurity\b/i,/\bcloud security\b/i]},
 {tag:'Education',patterns:[/教育/i,/教學/i,/學習/i,/\bedtech\b/i]},
 {tag:'Retail',patterns:[/零售/i,/電商/i,/電子商務/i,/餐飲/i,/食品/i,/消費/i,/\bretail\b/i,/\be-?commerce\b/i]},
 {tag:'Information Technology',patterns:[/\bCRM\b/i,/\bMarTech\b/i,/企業服務/i,/媒體/i,/廣告/i,/行銷科技/i,/\bSaaS\b/i]},
 {tag:'Semiconductor',patterns:[/半導體/i,/晶片/i,/\bsemiconductor\b/i,/\bchip\b/i,/晶圓/i,/封測/i]}
];
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function splitList(v){return String(v||'').replace(/\r?\n/g,',').split(/[、,，;；/|]+/).map(x=>x.trim()).filter(Boolean)}
function get(o,ks){for(const k of ks){if(o[k]!==undefined&&String(o[k]).trim())return String(o[k]).trim()}return ''}
function parseDate(v){if(!v)return null; const s=String(v).replace(/\./g,'/').replace(/-/g,'/'); const d=new Date(s); return isNaN(d)?null:d}
function year(v){const m=String(v||'').match(/\d{4}/); return m?m[0]:'—'}
function markets(v){const t=String(v||'').toLowerCase(); const set=new Set(); if(/台灣|臺灣|taiwan|tw/.test(t))set.add('台灣'); if(/日本|japan|jp/.test(t))set.add('日本'); if(/歐美|美國|歐洲|usa|u\.s\.|america|europe|eu|英國|德國|法國|加拿大|澳洲/.test(t))set.add('歐美'); if(/東南亞|新加坡|馬來西亞|泰國|越南|印尼|菲律賓|singapore|malaysia|thailand|vietnam|indonesia|philippines|asean/.test(t))set.add('東南亞'); if(/印度|india/.test(t))set.add('印度'); if(!set.size)set.add('不明'); return [...set]}
function industryTags(item){const industry=item['產業']||''; const text=[industry,item['公司業務說明']||'',item['公司簡介']||'',item['備註']||'',item['公司全稱']||''].join(' '); const tags=new Set(); INDUSTRY_RULES.forEach(r=>{if(r.patterns.some(p=>p.test(industry)))tags.add(r.tag)}); if(!tags.size){INDUSTRY_RULES.forEach(r=>{if(r.patterns.some(p=>p.test(text)))tags.add(r.tag)})} if(!tags.size)tags.add('Information Technology'); return [...tags]}
function normStartup(r,type){
 const name=get(r,['公司全稱','公司名稱','公司','團隊名稱']);
 const lev=get(r,['等級','會員等級']);
 const prem=/true|yes|是|1/i.test(get(r,['Premium','premium','加值']));
 const product=get(r,['產品與服務','產品服務','產品/服務','解決方案']);
 const scenario=get(r,['主要應用場景','應用場景','應用領域']);
 const target=get(r,['目標客戶','Target Customer','TA','目標市場']);
 return {...r,_type:type,name,
  desc:get(r,['公司業務說明','公司簡介','公司介紹','介紹','備註']),
  product,scenario,target,
  level:lev,premium:prem,
  founder:get(r,['負責人','主責經理','聯絡窗口']),
  title:get(r,['負責人職稱','職稱']),
  startYear:year(get(r,['公司成立時間','成立年份','成立時間'])),
  graduateYear:year(get(r,['畢業年分','畢業年份','出場年份','結業年份'])),
  marketTags:markets(get(r,['TA Market','目標市場','海外發展狀態','海外發展','target market'])),
  industryTags:industryTags(r)
 }}
function normPartner(r){
 let category=get(r,['partnerCategory','分類別','類別','類型','分類'])||'其他';
 if(category==='創育生態系'||category==='新創') category='新創生態系';
 const confidence=get(r,['partnerCategoryConfidence'])||'';
 const reason=get(r,['partnerCategoryReason'])||'';
 const contactRaw=get(r,['聯絡窗口 / 職稱','聯絡窗口','姓名','聯絡人','Contact','contact']);
 return {...r,
  name:get(r,['廠商名稱','公司','公司名稱','企業名稱','機構名稱','單位名稱','合作對象','名稱'])||'未命名合作對象',
  type:category,
  confidence:confidence,
  reason:reason,
  contact:contactRaw,
  title:get(r,['職稱','Title','title']),
  email:get(r,['聯繫資訊 (電話/信箱)','電子郵件','Email','email','信箱']),
  phone:get(r,['電話/分機','電話','手機','Phone','phone']),
  source:get(r,['來源','Source','source']),
  note:get(r,['主要洽談合作紀錄或現況','內部合作紀錄','合作紀錄','備註','說明','Note','note']),
  status:get(r,['合作狀態','狀態','Status','status'])||'待分類'
 }}
function normMember(r){return {...r,name:get(r,['公司全稱','公司名稱']),level:get(r,['等級']),status:get(r,['狀態']),startDate:parseDate(get(r,['起'])),endDate:parseDate(get(r,['迄'])),startText:get(r,['起']),endText:get(r,['迄'])}}
function normEvent(r){return {...r,
 name:get(r,['活動名稱','名稱','活動']),
 date:get(r,['辦理時間','日期','活動日期','時間']),
 host:get(r,['主辦單位','主辦']),
 place:get(r,['辦理地點','地點','活動地點']),
 startups:get(r,['參與新創','參與團隊']),
 partners:get(r,['參與企業','參與單位','合作企業']),
 result:get(r,['活動成果','成果','成功案例','備註']),
 photos:get(r,['活動照片','照片','圖片'])
}}
async function fetchType(type){
 const res=await fetch(`${API_BASE}?type=${type}`);
 if(!res.ok)throw new Error(`${type}: HTTP ${res.status}`);
 const json=await res.json();
 // 相容目前 Apps Script：{status:'ok', data:[...]}
 if(json.status==='ok')return json.data||[];
 // 相容新版 Apps Script：{startups:[...], alumni:[...], partners:[...], events:[...]}
 if(Array.isArray(json[type]))return json[type];
 if(Array.isArray(json.data))return json.data;
 throw new Error(`${type}: ${json.message||'API 回傳格式不符'}`);
}
async function loadAll(){try{document.body.style.cursor='wait'; const types=['startups','alumni','members','partners','events']; const results=await Promise.all(types.map(t=>fetchType(t).catch(e=>{console.warn(e.message);return []}))); types.forEach((t,i)=>raw[t]=results[i]); data.startups=raw.startups.map(x=>normStartup(x,'startups')); data.alumni=raw.alumni.map(x=>normStartup(x,'alumni')); data.members=raw.members.map(normMember); data.partners=raw.partners.map(normPartner); data.events=raw.events.map(normEvent); renderAll();}catch(e){alert('連線失敗：'+e.message)}finally{document.body.style.cursor='default'}}
function renderAll(){renderOverview();renderStartups('startups');renderStartups('alumni');renderPartners();renderEvents();renderMatch();}
function showPage(id){document.querySelectorAll('.page,.detail').forEach(x=>x.classList.remove('active'));document.getElementById('page-'+id).classList.add('active');document.querySelectorAll('.nav').forEach(b=>b.classList.remove('active'));[...document.querySelectorAll('.nav')].find(b=>b.textContent.includes(id==='overview'?'總覽':id==='startups'?'新創資料庫':id==='alumni'?'歷史新創':id==='partners'?'合作對象':id==='events'?'活動':'AI'))?.classList.add('active')}
function renderOverview(){const el=document.getElementById('page-overview'); const active=data.members.length?data.members.filter(m=>m.status==='有效'):data.startups; const now=new Date(); const in90=new Date(); in90.setDate(now.getDate()-90); const in30=new Date(); in30.setDate(now.getDate()+30); const recent=data.members.filter(m=>m.startDate&&m.startDate>=in90).slice(0,8); const expiring=active.filter(m=>m.endDate&&m.endDate>=now&&m.endDate<=in30).slice(0,8); const exits=data.members.filter(m=>m.status&&m.status!=='有效'&&m.endDate).sort((a,b)=>b.endDate-a.endDate).slice(0,8); el.innerHTML=`<div class="page-head"><div><h1 class="page-title">總覽 Overview</h1><div class="subtitle">更新於 ${new Date().toLocaleDateString()}</div></div></div><div class="grid4"><div class="card kpi p16"><small>有效會員</small><div class="num">${active.length}</div></div><div class="card kpi cyan p16"><small>歷史會員</small><div class="num">${data.alumni.length}</div></div><div class="card kpi orange p16"><small>合作對象</small><div class="num">${data.partners.length}</div></div><div class="card kpi green p16"><small>已建檔活動</small><div class="num">${data.events.length}</div></div></div><div class="overview-note">活動數為目前已建檔活動，不代表完整年度活動總數。</div><div class="grid3 section"><div class="card p16"><h3>🆕 近三個月新增會員</h3>${miniRows(recent,'startups')}</div><div class="card p16"><h3>⏳ 即將到期會員</h3>${miniRows(expiring,'startups','endText')}</div><div class="card p16"><h3>🚪 近期出場會員</h3>${miniRows(exits,'startups','endText')}</div></div><div class="grid2 section"><div class="card p16"><h3>▣ 產業 Treemap</h3><div class="treemap">${treemapHtml()}</div></div><div class="card p16"><h3>⭐ 會員等級分布</h3>${bars(levelCounts(data.members),'level')}</div></div><div class="card p16 section"><h3>📅 成立年份趨勢</h3>${bars(yearCounts(data.startups),'year')}</div>`}
function miniRows(arr,type,dateField='startText'){return arr.length?arr.map(x=>`<div class="list-row" onclick='openByName(${JSON.stringify(x.name)})'><b>${esc(x.name)}</b><span class="date">${esc(x[dateField]||'')}</span></div>`).join(''):'<div class="empty">目前無資料</div>'}
function levelCounts(arr){const o={}; arr.forEach(m=>{const k=m.level||'未分類'; o[k]=(o[k]||0)+1}); return o}
function yearCounts(arr){const o={}; arr.forEach(m=>{const k=m.startYear; if(k&&k!=='—')o[k]=(o[k]||0)+1}); return o}
function tagCounts(){const o={}; data.startups.forEach(s=>s.industryTags.forEach(t=>o[t]=(o[t]||0)+1)); return o}
function bars(obj,kind){const entries=Object.entries(obj).sort((a,b)=>b[1]-a[1]); const total=entries.reduce((s,x)=>s+x[1],0)||1; return entries.map(([k,v])=>`<div class="bar-row"><div>${esc(k)}</div><div class="bar-bg"><div class="bar-fill" style="width:${v/total*100}%"></div></div><div>${Math.round(v/total*100)}%</div></div>`).join('')||'<div class="empty">目前無資料</div>'}
function treemapHtml(){const entries=Object.entries(tagCounts()).sort((a,b)=>b[1]-a[1]); const total=entries.reduce((s,x)=>s+x[1],0)||1; const colors=['#2563eb','#0891b2','#059669','#d97706','#7c3aed','#0f766e','#475569','#64748b']; return entries.map(([k,v],i)=>`<div class="tile" onclick='filterByTag(${JSON.stringify(k)})' style="flex-grow:${Math.max(1,v)};background:${colors[i%colors.length]}">${esc(k)}<br>${Math.round(v/total*100)}%</div>`).join('')}
function renderFilters(type){const allTags=[...new Set(data[type].flatMap(s=>s.industryTags))].sort();return `<div class="filters"><div class="field"><label>搜尋</label><input id="q-${type}" placeholder="關鍵字..." oninput="applyFilters('${type}')"></div><div class="field multi" id="multi-ind-${type}"><label>產業</label><button class="multi-btn" onclick="toggleMulti('multi-ind-${type}')">全部產業 ▾</button><div class="multi-menu">${allTags.map(t=>`<label><input type="checkbox" value="${esc(t)}" onchange="applyFilters('${type}')">${esc(t)}</label>`).join('')}</div></div><div class="field"><label>會員等級</label><select id="level-${type}" onchange="applyFilters('${type}')"><option value="">全部</option>${LEVEL_OPTIONS.map(x=>`<option>${x}</option>`).join('')}</select></div><div class="field multi" id="multi-market-${type}"><label>目標市場</label><button class="multi-btn" onclick="toggleMulti('multi-market-${type}')">全部市場 ▾</button><div class="multi-menu">${MARKET_OPTIONS.map(t=>`<label><input type="checkbox" value="${esc(t)}" onchange="applyFilters('${type}')">${esc(t)}</label>`).join('')}</div></div>${type==='alumni'?`<div class="field"><label>畢業年份</label><select id="gradyear-${type}" onchange="applyFilters('${type}')"><option value="">全部</option>${[...new Set(data[type].map(s=>s.graduateYear).filter(y=>y&&y!=='—'))].sort().reverse().map(y=>`<option>${y}</option>`).join('')}</select></div>`:`<div class="field"><label>Premium</label><select id="premium-${type}" onchange="applyFilters('${type}')"><option value="">全部</option><option value="true">Premium</option><option value="false">非 Premium</option></select></div>`}<button class="btn" onclick="clearFilters('${type}')">清除篩選</button><div class="toggle"><button class="btn" onclick="viewMode='list';applyFilters('${type}')">☰ 列表</button><button class="btn" onclick="viewMode='card';applyFilters('${type}')">▦ 卡片</button></div></div>`}
function renderStartups(type){const el=document.getElementById('page-'+type); el.innerHTML=`<div class="page-head"><div><h1 class="page-title">${type==='startups'?'新創資料庫':'歷史新創'}</h1><div class="subtitle">共 ${data[type].length} 筆資料</div></div></div>${renderFilters(type)}<div id="view-${type}"></div>`; applyFilters(type)}
function checked(id){return [...document.querySelectorAll(`#${id} input:checked`)].map(x=>x.value)}
function applyFilters(type){let arr=[...data[type]]; const q=(document.getElementById('q-'+type)?.value||'').toLowerCase(); const tags=checked('multi-ind-'+type); const marketsSel=checked('multi-market-'+type); const lev=document.getElementById('level-'+type)?.value||''; const prem=document.getElementById('premium-'+type)?.value||''; const gy=document.getElementById('gradyear-'+type)?.value||''; if(q)arr=arr.filter(s=>[s.name,s.desc,s.product,s.scenario,s.target,s.founder,s['產業']].join(' ').toLowerCase().includes(q)); if(tags.length)arr=arr.filter(s=>tags.some(t=>s.industryTags.includes(t))); if(marketsSel.length)arr=arr.filter(s=>marketsSel.some(m=>s.marketTags.includes(m))); if(lev)arr=arr.filter(s=>s.level===lev); if(prem)arr=arr.filter(s=>String(s.premium)===prem); if(gy)arr=arr.filter(s=>s.graduateYear===gy); renderStartupView(type,arr)}
function clearFilters(type){document.getElementById('q-'+type).value=''; document.getElementById('level-'+type).value=''; if(document.getElementById('premium-'+type))document.getElementById('premium-'+type).value=''; if(document.getElementById('gradyear-'+type))document.getElementById('gradyear-'+type).value=''; document.querySelectorAll(`#multi-ind-${type} input,#multi-market-${type} input`).forEach(x=>x.checked=false); applyFilters(type)}
function tagHtml(s){return `<div class="tags">${s.premium?'<span class="tag premium">Premium</span>':''}${s.level?`<span class="tag level">${esc(s.level)}</span>`:''}</div><div class="tags">${s.industryTags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div><div class="tags">${s.marketTags.map(t=>`<span class="tag market">${esc(t)}</span>`).join('')}</div>`}
function renderStartupView(type,arr){const el=document.getElementById('view-'+type); if(viewMode==='card'){el.innerHTML=`<div class="cards">${arr.map(s=>`<div class="card startup-card" onclick='openDetail(${JSON.stringify(s.name)},"${type}")'><div class="card-title">${esc(s.name)}</div><div class="desc">${esc(s.desc||'暫無簡介描述。')}</div>${tagHtml(s)}<div class="meta"><span>👤 ${esc(s.founder||'—')}</span><span>📅 ${esc(s.startYear)}</span><span class="arrow">→</span></div></div>`).join('')}</div>`}else{el.innerHTML=`<div class="table-wrap"><table class="table"><thead><tr><th>公司名稱</th><th>產業標籤</th><th>會員等級</th><th>成立年份</th><th>目標市場</th><th>負責人</th><th></th></tr></thead><tbody>${arr.map(s=>`<tr onclick='openDetail(${JSON.stringify(s.name)},"${type}")'><td><b>${esc(s.name)}</b></td><td><div class="tags">${s.industryTags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div></td><td><div class="tags">${s.premium?'<span class="tag premium">Premium</span>':''}${s.level?`<span class="tag level">${esc(s.level)}</span>`:''}</div></td><td>${esc(s.startYear)}</td><td><div class="tags">${s.marketTags.map(t=>`<span class="tag market">${esc(t)}</span>`).join('')}</div></td><td>${esc(s.founder||'—')}</td><td class="arrow">→</td></tr>`).join('')}</tbody></table></div>`}}
function renderPartners(){
 const el=document.getElementById('page-partners');
 const counts={};
 data.partners.forEach(p=>counts[p.type]=(counts[p.type]||0)+1);
 const chips=['全部',...PARTNER_TYPES].map(t=>`<button class="category-chip ${t==='全部'?'active':''}" onclick='setPartnerType(${JSON.stringify(t)},this)'>${esc(t)} ${t==='全部'?data.partners.length:(counts[t]||0)}</button>`).join('');
 el.innerHTML=`<div class="page-head"><div><h1 class="page-title">合作對象</h1><div class="subtitle">共 ${data.partners.length} 筆合作對象</div></div></div><div class="category-panel" id="partner-cats">${chips}</div><div class="filters"><div class="field"><label>搜尋</label><input id="q-partners" placeholder="名稱、聯絡人、來源、備註..." oninput="applyPartnerFilters()"></div><div class="field"><label>類型</label><select id="type-partners" onchange="syncPartnerChip();applyPartnerFilters()"><option value="">全部</option>${PARTNER_TYPES.map(x=>`<option>${esc(x)}</option>`).join('')}</select></div><div class="field"><label>狀態</label><select id="status-partners" onchange="applyPartnerFilters()"><option value="">全部</option><option>待分類</option><option>合作中</option><option>洽談中</option><option>已結案</option></select></div><button class="btn" onclick="document.getElementById('q-partners').value='';document.getElementById('type-partners').value='';document.getElementById('status-partners').value='';syncPartnerChip();applyPartnerFilters()">清除篩選</button></div><div id="partners-view"></div>`;
 applyPartnerFilters();
}
function setPartnerType(t,btn){
 document.getElementById('type-partners').value=t==='全部'?'':t;
 document.querySelectorAll('#partner-cats .category-chip').forEach(x=>x.classList.remove('active'));
 if(btn)btn.classList.add('active');
 applyPartnerFilters();
}
function syncPartnerChip(){
 const v=document.getElementById('type-partners')?.value||'';
 document.querySelectorAll('#partner-cats .category-chip').forEach(x=>{
  const label=x.textContent.replace(/\s+\d+$/,'');
  x.classList.toggle('active',(v===''&&label==='全部')||label===v);
 });
}
function applyPartnerFilters(){
 let arr=[...data.partners];
 const q=(document.getElementById('q-partners')?.value||'').toLowerCase();
 const t=document.getElementById('type-partners')?.value||'';
 const st=document.getElementById('status-partners')?.value||'';
 if(q)arr=arr.filter(p=>[p.name,p.type,p.contact,p.email,p.source,p.note,p.reason].join(' ').toLowerCase().includes(q));
 if(t)arr=arr.filter(p=>p.type===t);
 if(st)arr=arr.filter(p=>p.status===st);
 const v=document.getElementById('partners-view');
 if(!arr.length){v.innerHTML='<div class="card empty">目前沒有符合條件的合作對象。</div>';return;}
 v.innerHTML=`<div class="cards">${arr.map(p=>`<div class="card partner-card"><div class="name">${esc(p.name)}</div><div class="tags"><span class="tag">${esc(p.type||'其他')}</span><span class="tag market">${esc(p.status||'待分類')}</span></div><div class="muted">${esc(p.note||p.source||'')}</div><div class="meta"><span>👤 ${esc(p.contact||'—')}</span><span>${esc(p.title||'')}</span></div></div>`).join('')}</div>`;
}
function renderEvents(){const el=document.getElementById('page-events'); const years=[...new Set(data.events.map(e=>e['活動年度']).filter(Boolean))].sort(); el.innerHTML=`<div class="page-head"><div><h1 class="page-title">活動紀錄</h1><div class="subtitle">目前顯示已建檔活動，不代表完整年度活動數</div></div></div><div class="filters"><div class="field"><label>搜尋</label><input id="q-events" placeholder="活動名稱、主辦、地點..." oninput="applyEventFilters()"></div><div class="field"><label>年度</label><select id="year-events" onchange="applyEventFilters()"><option value="">全部</option>${years.map(y=>`<option>${esc(y)}</option>`).join('')}</select></div><button class="btn" onclick="document.getElementById('q-events').value='';document.getElementById('year-events').value='';applyEventFilters()">清除篩選</button></div><div id="events-view"></div>`; applyEventFilters()}function applyEventFilters(){let arr=[...data.events]; const q=(document.getElementById('q-events')?.value||'').toLowerCase(); const y=document.getElementById('year-events')?.value||''; if(q)arr=arr.filter(ev=>[ev.name,ev.date,ev.place,ev.host,ev.result,ev.startups,ev.partners].join(' ').toLowerCase().includes(q)); if(y)arr=arr.filter(ev=>String(ev['活動年度']||'')===y); const v=document.getElementById('events-view'); v.innerHTML=arr.length?`<div class="cards">${arr.map(ev=>`<div class="card partner-card"><div class="name">${esc(ev.name)}</div><div class="tags">${ev['活動年度']?`<span class="tag level">${esc(ev['活動年度'])}</span>`:''}</div><div class="muted">${esc(ev.date)}｜${esc(ev.place)}｜${esc(ev.host)}</div><div class="desc">${esc(ev.result||'')}</div></div>`).join('')}</div>`:'<div class="card empty">活動資料尚未串接或目前沒有符合篩選的活動。</div>'}
function renderMatch(){document.getElementById('page-match').innerHTML=`<div class="page-head"><div><h1 class="page-title">AI 媒合中心</h1><div class="subtitle">預留功能：未來可根據企業需求比對新創與合作對象</div></div></div><div class="card p16"><textarea id="matchText" style="width:100%;height:120px;border:1px solid var(--line);border-radius:12px;padding:12px" placeholder="輸入企業需求，例如：尋找 AI 碳盤查、智慧製造、醫療照護相關新創..."></textarea><br><br><button class="btn primary" onclick="simpleMatch()">初步媒合</button><div id="matchResult" class="section"></div></div>`}
function simpleMatch(){const q=document.getElementById('matchText').value.toLowerCase(); const scored=data.startups.map(s=>{let score=0; s.industryTags.forEach(t=>{if(q.includes(t.toLowerCase()))score+=2}); if(q&&[s.name,s.desc,s['產業']].join(' ').toLowerCase().includes(q))score+=3; return {s,score}}).filter(x=>x.score>0).sort((a,b)=>b.score-a.score).slice(0,8); document.getElementById('matchResult').innerHTML=scored.length?scored.map(x=>`<div class="list-row" onclick='openDetail(${JSON.stringify(x.s.name)},"startups")'><b>${esc(x.s.name)}</b><span>Score ${x.score}</span></div>`).join(''):'<div class="empty">尚無明顯匹配，建議輸入更具體的產業或需求。</div>'}
function openByName(name){const s=data.startups.find(x=>x.name===name)||data.alumni.find(x=>x.name===name); if(s)openDetail(name,s._type||'startups')}
function openDetail(name,type='startups'){const item=(data[type]||[]).find(x=>x.name===name)||data.startups.find(x=>x.name===name)||data.alumni.find(x=>x.name===name); if(!item)return; document.querySelectorAll('.page').forEach(x=>x.classList.remove('active')); const d=document.getElementById('detail'); d.classList.add('active'); const basic=[['負責人',item.founder],['負責人職稱',item.title],['成立年份',item.startYear],['畢業年份',item.graduateYear&&item.graduateYear!=='—'?item.graduateYear:'']].filter(x=>x[1]); const similar=getSimilarStartups(item,5); d.innerHTML=`<button class="back" onclick="showPage('${type}')">← 返回</button><div class="card detail-hero"><div><div class="detail-title">${esc(item.name)}</div>${tagHtml(item)}</div><button class="edit" onclick="editData()">更新資料</button></div><div class="detail-grid"><div class="card p16"><h3>公司內容</h3><div class="kv"><b>公司簡介</b><div>${esc(item.desc||'暫無簡介描述。')}</div></div><div class="kv"><b>產品與服務</b><div>${esc(item.product||'尚未提供')}</div></div><div class="kv"><b>主要應用場景</b><div>${esc(item.scenario||'尚未提供')}</div></div><div class="kv"><b>目標客戶</b><div>${esc(item.target||'尚未提供')}</div></div><div class="kv"><b>資料保護</b><div>統編、電話、Email、地址等敏感欄位不在此頁顯示；如需原始聯繫資訊，請回 Google Sheet 查看。</div></div></div><div class="card p16"><h3>基本資料</h3>${basic.map(([k,v])=>`<div class="kv"><b>${esc(k)}</b><div>${esc(v)}</div></div>`).join('')||'<div class="empty">無基本資料</div>'}</div></div><div class="card p16 section"><h3>更多相似新創</h3>${similar.length?`<div class="similar-grid">${similar.map(x=>`<div class="similar-card" onclick='openDetail(${JSON.stringify(x.s.name)},${JSON.stringify(x.s._type||'startups')})'><div class="sim-name">${esc(x.s.name)}</div><div class="tags">${x.common.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div><div class="sim-score">相同標籤 ${x.common.length} 個</div></div>`).join('')}</div>`:'<div class="empty">目前沒有相似新創</div>'}</div>`}
function getSimilarStartups(item,limit=5){const pool=[...data.startups,...data.alumni].filter(s=>s.name!==item.name); const base=new Set(item.industryTags||[]); return pool.map(s=>{const common=(s.industryTags||[]).filter(t=>base.has(t)); return {s,common,score:common.length}}).filter(x=>x.score>0).sort((a,b)=>b.score-a.score||String(a.s.name).localeCompare(b.s.name,'zh-Hant')).slice(0,limit)}
function filterByTag(tag){showPage('startups'); setTimeout(()=>{document.querySelectorAll('#multi-ind-startups input').forEach(x=>x.checked=x.value===tag); applyFilters('startups')},0)}
function toggleMulti(id){document.querySelectorAll('.multi').forEach(m=>{if(m.id!==id)m.classList.remove('open')});document.getElementById(id).classList.toggle('open')}
document.addEventListener('click',e=>{if(!e.target.closest('.multi'))document.querySelectorAll('.multi').forEach(m=>m.classList.remove('open'))})
function editData(){if(confirm('資料修改請至 Google Sheet 更新，更新後重新整理網站即可同步。\n\n是否前往資料庫？')) window.open(DATA_SHEET_URL,'_blank')}
function globalSearch(){const q=document.getElementById('globalSearch').value.toLowerCase(); if(!q)return; showPage('startups'); setTimeout(()=>{document.getElementById('q-startups').value=q; applyFilters('startups')},0)}
loadAll();
</script>
</body>
